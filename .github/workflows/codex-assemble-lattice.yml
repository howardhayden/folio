          for path in ['docs/text-to-lattice/TEXT-TO-LATTICE-RELEASE-QUALIFICATION.md','public/documentation/text-to-lattice/TEXT-TO-LATTICE-RELEASE-QUALIFICATION.md']:
              p=Path(path); t=p.read_text();
              if t.count(old_source)!=1: raise SystemExit(path)
              p.write_text(t.replace(old_source,new_source))
          for path in ['docs/text-to-lattice/TEXT-TO-LATTICE-RELEASE-REGISTER.json','public/documentation/text-to-lattice/TEXT-TO-LATTICE-RELEASE-REGISTER.json']:
              p=Path(path); t=p.read_text();
              if t.count(old_dossier)!=1 or t.count(old_source)!=2: raise SystemExit(path)
              p.write_text(t.replace(old_dossier,new_dossier).replace(old_source,new_source))
          p=Path('public/documentation/text-to-lattice/artifact-manifest.json'); t=p.read_text()
          if t.count(old_dossier)!=2 or t.count(old_register)!=2: raise SystemExit('manifest')
          p.write_text(t.replace(old_dossier,new_dossier).replace(old_register,new_register))
