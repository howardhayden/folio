name: Assemble Text to Lattice publication

on:
  push:
    branches: [codex/text-to-lattice-output-visibility-2026-09-13]

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.head_commit.message != 'Refresh Text to Lattice output visibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/text-to-lattice-output-visibility-2026-09-13
          fetch-depth: 0
      - name: Apply verified candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          def once(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1: raise SystemExit(f'unexpected match count in {path}')
              p.write_text(text.replace(old,new,1))
          app='app/resume/ResumeProjects.tsx'
          once(app,'  const latticeOutputRef = useRef<HTMLElement>(null);\n','  const latticeOutputRef = useRef<HTMLElement>(null);\n  const latticeOutputRefreshRef = useRef<(() => void) | null>(null);\n')
          once(app,'    document.addEventListener("keyup", handlePrintScreen, true);\n    handleVisibility();\n    return () => {\n','    document.addEventListener("keyup", handlePrintScreen, true);\n    latticeOutputRefreshRef.current = reveal;\n    handleVisibility();\n    return () => {\n      latticeOutputRefreshRef.current = null;\n')
          once(app,'  }, [latticeOpen]);\n\n  const openLattice = useCallback((trigger: HTMLAnchorElement) => {\n','  }, [latticeOpen]);\n\n  useEffect(() => {\n    // Refresh on result arrival without recreating the protection controller\n    // or resetting its active print/capture deadline.\n    if (latticeOpen && latticeResult) latticeOutputRefreshRef.current?.();\n  }, [latticeOpen, latticeResult]);\n\n  const openLattice = useCallback((trigger: HTMLAnchorElement) => {\n')
