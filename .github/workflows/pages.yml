name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Require current main before build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-current-main-sha.mjs
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Fetch and verify pinned tokenizer fixtures
        run: node scripts/fetch-lattice-tokenizers.mjs
      - name: Fetch and verify held Text to Lattice WASM identities
        run: npm run release:lattice:verify:wasm
      - run: npm test
      - name: Verify held Text to Lattice release boundary
        run: npm run release:lattice:verify:site
      - name: Require current main before artifact upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-current-main-sha.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require current main before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-current-main-sha.mjs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
