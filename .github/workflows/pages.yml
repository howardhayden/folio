name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_text_to_lattice_services:
        description: Deploy and smoke-test held services for qualification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publication-boundary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      public_client_status: ${{ steps.release-state.outputs.public_client_status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - id: release-state
        name: Read Text to Lattice publication boundary
        run: node scripts/read-text-to-lattice-release-state.mjs

  build:
    if: github.ref == 'refs/heads/main'
    needs: publication-boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Require current main before build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-current-main-sha.mjs
      - run: npm ci --ignore-scripts
      - name: Enforce Text to Lattice network privacy boundary
        run: >-
          node --test
          tests/lattice-network-capability.test.mjs
          tests/lattice-network-governance.test.mjs
          tests/lattice-api-worker.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify Text to Lattice release boundary
        run: npm run release:lattice:verify:site
      - name: Require current main before artifact upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-current-main-sha.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  deploy_text_to_lattice_services:
    name: Deploy Text to Lattice services
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        needs.publication-boundary.outputs.public_client_status == 'enabled' ||
        (
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[deploy-text-to-lattice-services]')
        ) ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_text_to_lattice_services == true)
      )
    environment:
      name: text-to-lattice-production
    runs-on: ubuntu-latest
    concurrency:
      group: text-to-lattice-services
      cancel-in-progress: false
    needs: [publication-boundary, build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - name: Require current main before service deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-current-main-sha.mjs
      - name: Install pinned Worker deployment tooling
        run: npm ci --ignore-scripts --prefix workers
      - name: Require protected Cloudflare deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEXT_TO_LATTICE_DEPLOY_TOKEN }}
        run: >-
          node -e 'for (const name of ["CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN"])
          if (!process.env[name]) throw new Error(`${name} is not configured in the protected environment.`)'
      - name: Inspect Text to Lattice API encrypted binding names
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEXT_TO_LATTICE_DEPLOY_TOKEN }}
        run: >-
          ./workers/node_modules/.bin/wrangler secret list --format json
          --config workers/text-to-lattice-api/wrangler.jsonc
          > "$RUNNER_TEMP/text-to-lattice-api-secret-bindings.json"
      - name: Require the server-only provider credential binding
        run: >-
          node -e 'const fs = require("node:fs");
          const bindings = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          if (!Array.isArray(bindings) ||
          !bindings.some((binding) => binding?.name === "HF_TOKEN" && binding?.type === "secret_text"))
          throw new Error("HF_TOKEN is not provisioned as an encrypted Text to Lattice API Worker binding.")'
          "$RUNNER_TEMP/text-to-lattice-api-secret-bindings.json"
      - name: Deploy bounded Text to Lattice API
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEXT_TO_LATTICE_DEPLOY_TOKEN }}
        run: >-
          ./workers/node_modules/.bin/wrangler deploy
          --config workers/text-to-lattice-api/wrangler.jsonc
      - name: Verify deployed Text to Lattice API boundary
        env:
          LATTICE_API_BASE_URL: https://hah.dev
        run: >-
          node --test
          --test-name-pattern="the optional deployed boundary rejects ambient methods without a sample"
          tests/lattice-network-governance.test.mjs
      - name: Deploy résumé response policy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEXT_TO_LATTICE_DEPLOY_TOKEN }}
        run: >-
          ./workers/node_modules/.bin/wrangler deploy
          --config workers/text-to-lattice-response-policy/wrangler.jsonc
      - name: Require current main after service verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-current-main-sha.mjs

  deploy:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.publication-boundary.result == 'success' &&
      needs.build.result == 'success' &&
      (
        (
          needs.publication-boundary.outputs.public_client_status == 'held' &&
          contains(fromJSON('["skipped", "success"]'), needs.deploy_text_to_lattice_services.result)
        ) ||
        (
          needs.publication-boundary.outputs.public_client_status == 'enabled' &&
          needs.deploy_text_to_lattice_services.result == 'success'
        )
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: [publication-boundary, build, deploy_text_to_lattice_services]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require current main before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-current-main-sha.mjs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
